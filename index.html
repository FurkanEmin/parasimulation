<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paraelektrik Faz Simülasyonu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.05);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }
        canvas {
            background-color: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            margin-top: 20px;
        }
        .controls {
            margin-top: 25px;
            text-align: left;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
        }
        input[type="range"] {
            width: 100%;
            margin-bottom: 20px;
            accent-color: #e74c3c;
        }
        #eSlider {
            accent-color: #3498db;
        }
        .metrics {
            display: flex;
            justify-content: space-between;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Paraelektrik Dipol Simülasyonu</h2>
    <p style="color: #a0a0a0;">Sıcaklık (Isıl Titreşim) ve Elektrik Alan arasındaki savaş.</p>
    
    <div class="metrics">
        <span id="polDisplay">Net Polarizasyon: %0</span>
        <span id="stateDisplay">Durum: Tamamen Rastgele</span>
    </div>

    <canvas id="simCanvas" width="600" height="300"></canvas>

    <div class="controls">
        <label id="tLabel" for="tSlider">Sıcaklık (T): Termal Titreşimleri Artırır</label>
        <input type="range" id="tSlider" min="0" max="100" value="80">

        <label id="eLabel" for="eSlider">Dış Elektrik Alan (E): Dipolleri Sağa Hizalar</label>
        <input type="range" id="eSlider" min="0" max="100" value="0">
    </div>

    <div style="margin-top: 35px; padding-top: 25px; border-top: 1px solid #444; font-size: 0.9em; color: #888; text-align: center;">
    <strong style="color: #a0a0a0;">Contributors:</strong><br>
    Furkan Emin Çetinalp, Belma Halaçlar
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const tSlider = document.getElementById('tSlider');
    const eSlider = document.getElementById('eSlider');
    const polDisplay = document.getElementById('polDisplay');
    const stateDisplay = document.getElementById('stateDisplay');

    // Dipolleri oluştur (ızgara şeklinde)
    const dipoles = [];
    const cols = 15;
    const rows = 7;
    const spacingX = canvas.width / cols;
    const spacingY = canvas.height / rows;

    for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
            dipoles.push({
                x: i * spacingX + spacingX / 2,
                y: j * spacingY + spacingY / 2,
                baseAngle: Math.random() * Math.PI * 2, // Rastgele başlangıç
                currentAngle: 0
            });
        }
    }

    function drawDipole(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        
        // Ok gövdesi
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(10, 0);
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Ok ucu (Artı kutbu temsil eder)
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(4, -4);
        ctx.lineTo(4, 4);
        ctx.fillStyle = '#e74c3c'; // Kırmızı uç
        ctx.fill();

        ctx.restore();
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const temp = parseInt(tSlider.value);
        const eField = parseInt(eSlider.value);
        
        let netPolX = 0;

        dipoles.forEach(d => {
            // Elektrik alan dipolü 0 derecesine (sağa) çekmek ister
            // E alanı güçlüyse baseAngle 0'a yaklaşır
            const alignmentStrength = eField / 100;
            const targetAngle = d.baseAngle * (1 - alignmentStrength); 
            
            // Sıcaklık sürekli rastgele titreşim (jitter) ekler
            const thermalJitter = (Math.random() - 0.5) * (temp / 100) * Math.PI * 2;
            
            // Eğer sıcaklık çok düşükse ve E alanı varsa titreme azalır
            d.currentAngle = targetAngle + thermalJitter;
            
            drawDipole(d.x, d.y, d.currentAngle);
            
            // Polarizasyon hesabı (X eksenindeki kosinüs bileşenleri)
            netPolX += Math.cos(d.currentAngle);
        });

        // Net polarizasyonu yüzdeye çevir
        let maxPol = dipoles.length;
        let polPercent = Math.max(0, (netPolX / maxPol) * 100);
        
        polDisplay.innerText = `Net Polarizasyon: %${polPercent.toFixed(1)}`;

        if (polPercent < 15) {
            stateDisplay.innerText = "Durum: Tamamen Rastgele (Kutuplanma Yok)";
            stateDisplay.style.color = "#a0a0a0";
        } else if (polPercent < 70) {
            stateDisplay.innerText = "Durum: Kısmi Kutuplanma";
            stateDisplay.style.color = "#f1c40f";
        } else {
            stateDisplay.innerText = "Durum: Yüksek Kutuplanma (Doyum)";
            stateDisplay.style.color = "#2ecc71";
        }

        requestAnimationFrame(animate);
    }

    // Animasyonu başlat
    animate();
</script>

</body>
</html>
